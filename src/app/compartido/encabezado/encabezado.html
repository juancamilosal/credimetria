<a class="visualmente-oculto saltar" href="#contenido">Ir al contenido</a>
<header class="cabecera">
  <div class="wrap barra">
    <a routerLink="/" class="marca" aria-label="Credimetría, inicio">
      <app-logo [tamano]="38" />
    </a>

    <button
      class="btn-icono tema"
      type="button"
      [attr.aria-label]="
        temas.tema() === 'claro'
          ? 'Cambiar a modo oscuro'
          : 'Cambiar a modo claro'
      "
      [attr.title]="temas.tema() === 'claro' ? 'Modo oscuro' : 'Modo claro'"
      (click)="temas.alternar()"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        @if (temas.tema() === "claro") {
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        } @else {
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        }
      </svg>
    </button>

    <button
      class="btn-icono btn-menu"
      type="button"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="menu"
      (click)="alternarMenu()"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        @if (menuAbierto()) {
          <path d="M6 6l12 12M18 6L6 18" />
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>

    <nav id="menu" aria-label="Principal" [class.abierto]="menuAbierto()">
      <a
        routerLink="/ranking"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
      >
        Ranking de tasas
      </a>
      <a
        routerLink="/simulador"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
      >
        Simulador
      </a>
      <a
        routerLink="/compara-tu-oferta"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
      >
        Compara tu oferta
      </a>
      <a routerLink="/" fragment="como-funciona">Cómo funciona</a>
      <a
        routerLink="/aliados"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
      >
        Aliados
      </a>
      <a routerLink="/asesoria" class="btn btn-principal asesoria"
        >Asesoría gratis</a
      >
    </nav>
  </div>
</header>
